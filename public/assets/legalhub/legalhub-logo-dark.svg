  </g>

  <text x="112" y="60" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Legal<tspan fill="#06B6D4">Hub</tspan>
