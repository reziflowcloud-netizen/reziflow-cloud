<svg width="360" height="96" viewBox="0 0 360 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LegalHub logo for dark backgrounds</title>
  <desc id="desc">LegalHub wordmark with a connected hub symbol optimized for dark and slate themes.</desc>
  <g transform="translate(16 8)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 40L40 8" stroke="#F2A100" />
    <path d="M40 40L12.3 24" stroke="#FFFFFF" />
    <path d="M40 40L67.7 24" stroke="#FFFFFF" />
    <path d="M40 40L12.3 56" stroke="#06B6D4" />
    <path d="M40 40L67.7 56" stroke="#06B6D4" />

    <circle cx="40" cy="40" r="17" fill="none" stroke="#FFFFFF" />
    <circle cx="40" cy="40" r="8" fill="none" stroke="#FFFFFF" stroke-width="3.2" />

    <circle cx="40" cy="8" r="5.5" fill="#F2A100" />
    <circle cx="12.3" cy="24" r="5.5" fill="#FFFFFF" />
    <circle cx="67.7" cy="24" r="5.5" fill="#FFFFFF" />
    <circle cx="12.3" cy="56" r="5.5" fill="#06B6D4" />
