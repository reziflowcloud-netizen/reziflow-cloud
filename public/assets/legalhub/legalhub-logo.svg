<svg width="360" height="96" viewBox="0 0 360 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">LegalHub logo</title>
  <desc id="desc">LegalHub wordmark with a connected hub symbol.</desc>
  <defs>
    <style>
      .navy { stroke: #08264A; }
      .teal { stroke: #06B6D4; }
      .amber { stroke: #F2A100; }
      .navy-fill { fill: #08264A; }
      .teal-fill { fill: #06B6D4; }
      .amber-fill { fill: #F2A100; }
    </style>
  </defs>

  <g transform="translate(16 8)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <path class="amber" d="M40 40L40 8" />
    <path class="navy" d="M40 40L12.3 24" />
    <path class="navy" d="M40 40L67.7 24" />
    <path class="teal" d="M40 40L12.3 56" />
    <path class="teal" d="M40 40L67.7 56" />

    <circle cx="40" cy="40" r="17" fill="#FFFFFF" class="navy" />
    <circle cx="40" cy="40" r="8" fill="#FFFFFF" class="navy" stroke-width="3.2" />

    <circle cx="40" cy="8" r="5.5" class="amber-fill" stroke="none" />
    <circle cx="12.3" cy="24" r="5.5" class="navy-fill" stroke="none" />
    <circle cx="67.7" cy="24" r="5.5" class="navy-fill" stroke="none" />
    <circle cx="12.3" cy="56" r="5.5" class="teal-fill" stroke="none" />
    <circle cx="67.7" cy="56" r="5.5" class="teal-fill" stroke="none" />
  </g>

  <text x="112" y="60" fill="#08264A" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Legal<tspan fill="#06B6D4">Hub</tspan>
  </text>
</svg>
