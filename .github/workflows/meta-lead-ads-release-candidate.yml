name: Meta Lead Ads release candidate (no secrets)
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'scripts/local-maintenance/**'
      - 'scripts/meta-lead-ads-worker.mjs'
      - '.github/workflows/meta-lead-ads-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acl-guards:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Strict ACL model tests (no database or private paths)
        shell: pwsh
        run: pwsh -NoProfile -File tests/local-maintenance/acl-tests.ps1
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://synthetic@127.0.0.1:1/never_connect
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: node --test tests/meta-lead-ads.test.mjs tests/meta-lead-ads-release.test.mjs tests/staff-routing-scope.test.mjs tests/lead-responsible-visibility.test.mjs tests/notifications-policy.test.mjs
      - run: npm run build
