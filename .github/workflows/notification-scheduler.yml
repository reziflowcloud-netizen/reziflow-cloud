name: Production notification scheduler

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Leave empty for fallback; CONFIGURE_PAUSED_ONLY; VERIFY_TRANSPORT_DIAGNOSTIC; ACTIVATE_TESTREZIDENTS_PILOT
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-notification-scheduler
  cancel-in-progress: false

jobs:
  notifications:
    if: github.ref == 'refs/heads/main' && vars.NOTIFICATION_SCHEDULER_ENABLED == 'true' && inputs.confirmation == ''
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Restore continuation
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .scheduler/notification-checkpoint.json
          key: notification-production-v1-${{ github.run_id }}-${{ github.run_attempt }}

          restore-keys: notification-production-v1-
      - name: Run production sweep
        env:
          NOTIFICATION_JOB_ORIGIN: https://legalhubcrm.com
          NOTIFICATION_JOB_CHECKPOINT: .scheduler/notification-checkpoint.json
          CRON_SECRET: ${{ secrets.NOTIFICATION_PRODUCTION_CRON_SECRET }}
        run: node scripts/run-notification-job.mjs
      - name: Save continuation even after interruption
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .scheduler/notification-checkpoint.json
          key: notification-production-v1-${{ github.run_id }}-${{ github.run_attempt }}

  configure-qstash:
    if: inputs.confirmation == 'CONFIGURE_PAUSED_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Configure paused QStash only
        env:
          QSTASH_SETUP_CONFIRMATION: ${{ inputs.confirmation }}
          NOTIFICATION_PRODUCTION_CRON_SECRET: ${{ secrets.NOTIFICATION_PRODUCTION_CRON_SECRET }}
          QSTASH_NOTIFICATION_SETUP_TOKEN: ${{ secrets.QSTASH_NOTIFICATION_SETUP_TOKEN }}
        run: node scripts/setup-notification-qstash.mjs

  verify-transport:
    if: inputs.confirmation == 'VERIFY_TRANSPORT_DIAGNOSTIC'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify no-generation transport
        env:
          NOTIFICATION_PRODUCTION_CRON_SECRET: ${{ secrets.NOTIFICATION_PRODUCTION_CRON_SECRET }}
        run: node scripts/verify-notification-transport.mjs

  activate-qstash-pilot:
    if: inputs.confirmation == 'ACTIVATE_TESTREZIDENTS_PILOT'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Activate existing QStash pilot schedule only
        env:
          QSTASH_ACTIVATION_CONFIRMATION: ${{ inputs.confirmation }}
          NOTIFICATION_PRODUCTION_CRON_SECRET: ${{ secrets.NOTIFICATION_PRODUCTION_CRON_SECRET }}
          QSTASH_NOTIFICATION_SETUP_TOKEN: ${{ secrets.QSTASH_NOTIFICATION_SETUP_TOKEN }}
        run: node scripts/activate-notification-qstash.mjs
