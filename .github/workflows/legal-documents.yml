name: Static legal documents (no database or secrets)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/privacy/**'
      - 'src/app/data-deletion/**'
      - 'src/app/regulamin/**'
      - 'src/components/LegalDocument.tsx'
      - 'src/lib/legalDocuments.ts'
      - 'tests/legal-documents.test.mjs'
      - '.github/workflows/legal-documents.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Render the real public server components without a DB or credentials
        run: node --test tests/legal-documents.test.mjs
